# ═══════════════════════════════════════════════════════════════
# dbt/profiles.yml
# Connexion PostgreSQL pour dbt
# ═══════════════════════════════════════════════════════════════
f1_data_hub:
  target: prod
  outputs:
    prod:
      type: postgres
      host: postgres
      port: 5432
      user: f1user
      password: f1pass
      dbname: f1_data_hub
      schema: staging
      threads: 4
      connect_timeout: 10
